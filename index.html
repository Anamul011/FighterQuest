html, body {
  background: #070b1f;
}
body {
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
@keyframes fq-rise {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@keyframes fq-pop {
  0% {
    transform: scale(0.6);
    opacity: 0;
  }
  60% {
    transform: scale(1.08);
    opacity: 1;
  }
  100% {
    transform: scale(1);
  }
}
@keyframes fq-pulse {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.6;
  }
}
@keyframes fq-float {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-5px);
  }
}
@keyframes fq-confetti {
  0% {
    transform: translateY(-10vh) rotate(0);
    opacity: 1;
  }
  100% {
    transform: translateY(105vh) rotate(720deg);
    opacity: 0.2;
  }
}
@keyframes fq-glow {
  0%, 100% {
    box-shadow: 0 0 0 0 rgba(251, 191, 36, 0.0), 0 8px 30px -6px rgba(139, 92, 246, 0.8);
  }
  50% {
    box-shadow: 0 0 0 6px rgba(251, 191, 36, 0.35), 0 8px 30px -6px rgba(139, 92, 246, 0.8);
  }
}
@keyframes fq-muscle {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.75;
  }
}
@keyframes fq-heart {
  0%, 100% {
    transform: scale(1);
  }
  15% {
    transform: scale(1.15);
  }
  30% {
    transform: scale(1);
  }
}
.fq-rise {
  animation: fq-rise 0.35s ease-out both;
}
.fq-pop {
  animation: fq-pop 0.55s cubic-bezier(.2,.9,.3,1.3) both;
}
.fq-pulse {
  animation: fq-pulse 2.4s ease-in-out infinite;
}
.fq-float {
  animation: fq-float 3s ease-in-out infinite;
}
.fq-confetti {
  animation-name: fq-confetti;
  animation-timing-function: cubic-bezier(.3,.6,.6,1);
  animation-fill-mode: both;
}
.fq-pulse-btn {
  animation: fq-glow 1.2s ease-in-out infinite;
}
.fq-muscle-on {
  animation: fq-muscle 1.8s ease-in-out infinite;
}
.fq-heart {
  transform-box: fill-box;
  transform-origin: center;
  animation: fq-heart 1.1s ease-in-out infinite;
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
  }
}
.fq-hero-mask {
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 14%, #000 82%, transparent 100%), linear-gradient(to top, #000 70%, transparent 100%);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(to right, transparent 0, #000 14%, #000 82%, transparent 100%), linear-gradient(to top, #000 70%, transparent 100%);
  mask-composite: intersect;
}
.fq-soft-mask {
  -webkit-mask-image: radial-gradient(ellipse 75% 75% at 50% 50%, #000 62%, transparent 100%);
  mask-image: radial-gradient(ellipse 75% 75% at 50% 50%, #000 62%, transparent 100%);
}
@keyframes fq-dash {
  to {
    stroke-dashoffset: -28;
  }
}
.fq-dash {
  animation: fq-dash 2.5s linear infinite;
}
.fq-title {
  letter-spacing: -0.01em;
}
